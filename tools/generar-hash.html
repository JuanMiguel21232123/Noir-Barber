<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Generar contraseña de barbero</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  label { display: block; margin-top: 14px; font-weight: 600; }
  input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
  button { margin-top: 18px; padding: 10px 18px; cursor: pointer; }
  pre { background: #111; color: #0f0; padding: 14px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; margin-top: 18px; }
  p.note { color: #555; font-size: 14px; }
</style>
</head>
<body>
  <h1>Generar acceso de barbero</h1>
  <p class="note">
    Esto corre solo en tu navegador, no envía nada a ningún servidor.
    Genera el SQL para crear o actualizar un barbero en Turso, con la
    contraseña ya convertida al mismo formato que usa el backend.
  </p>

  <label>ID (déjalo vacío para generar uno nuevo)</label>
  <input id="id" placeholder="se genera automático si lo dejas vacío">

  <label>Nombre</label>
  <input id="name" placeholder="Ej: Juan Pérez">

  <label>Usuario (para iniciar sesión)</label>
  <input id="username" placeholder="Ej: juan">

  <label>Contraseña</label>
  <input id="password" type="password" placeholder="Contraseña elegida">

  <button id="go">Generar SQL</button>

  <pre id="out" hidden></pre>

  <script>
    function toHex(buf) { return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join(""); }

    async function hashPassword(password) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
      const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" }, key, 256);
      return `pbkdf2$100000$${toHex(salt)}$${toHex(bits)}`;
    }
    function esc(s) { return String(s).replace(/'/g, "''"); }

    document.getElementById("go").addEventListener("click", async () => {
      const id = document.getElementById("id").value.trim() || crypto.randomUUID();
      const name = document.getElementById("name").value.trim();
      const username = document.getElementById("username").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      if (!name || !username || !password) return alert("Completa nombre, usuario y contraseña.");

      const hash = await hashPassword(password);
      const sql =
`-- Si el barbero NO existe todavía:
INSERT INTO barbers (id, name, username, pass_hash, active, accepting)
VALUES ('${id}', '${esc(name)}', '${esc(username)}', '${hash}', 1, 1);

-- Si ya existe y solo quieres cambiarle la contraseña:
UPDATE barbers SET pass_hash = '${hash}' WHERE username = '${esc(username)}';`;

      const out = document.getElementById("out");
      out.hidden = false;
      out.textContent = sql;
    });
  </script>
</body>
</html>
